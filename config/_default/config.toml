[[params.feature]]
	FeatureTitle = "Massage Packages"
	FeatureDescription = "Pre-order a massage package and save! Massage packages available for weekly, bi-weekly, or monthly in-home visits."
	FeatureImage = "images/open-path-logo-new.webp"

[[params.feature]]
	FeatureTitle = "Massage for Events"
	FeatureDescription = "Add relaxing table massage or chair massage to your office wellness program, next open house, sports massage for athletes before events, or any other event."
