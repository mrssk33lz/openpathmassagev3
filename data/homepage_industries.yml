########################### about industries #############################
about:
  enable : true
  title : "Affordable Small Business Websites"
  content : "We build and maintain small business websites optimized for performance and accessibility that fit your budget. We also offer a wide range of website support services for small businesses to help maintain your site and build your brand online allowing you to focus on your business and your customers."
  image : "images/company/company-group-pic.jpg"


########################## featured service ############################
featured_service:
  enable : true
  service_item:
    # featured service item loop
    - name : "Small Business Website Services"
      icon : "ion-code"
      color : "primary"
      content : "We offer affordable website development and website support services for small businesses and organizations. Let us focus on your website while you focus on your business."
      
    # featured service item loop
    - name : "Drupal Website Services"
      icon : "ion-erlenmeyer-flask"
      color : "primary-dark"
      content : "Arbor Web Development specializes in Drupal website development, Drupal consulting, and Drupal support. We offer affordable Drupal services for small businesses and organizations. "
      
    # featured service item loop
    - name : "Website Optimization Services"
      icon : "ion-lightbulb"
      color : "primary-darker"
      content : "We offer website optimization services for small business websites. Many websites are poorly optimized for performance, SEO, and other reasons. We will audit your site and find areas to improve."

      
