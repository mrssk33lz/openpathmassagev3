############################# About #################################
about:
  enable : true
  title : "We love helping small business!"
  description : "One of the top reasons small businesses fail is because they never create a branded website with a custom domain for their business, or it is severely outdated. We want to help change that by providing affordable website services for small businesses and organizations around the world."
  content : "Most small businesses are in growingly competitive local markets. Establish and maintain your brand online in the growing digital economy. Building a custom website for your small business is crucial in becoming a leader both locally and worldwide for your company's brand."
  image : "images/company/about.jpg"


######################### Portfolio ###############################
portfolio:
  enable : true
  bg_image : "images/chris-ried-ieic5Tq8YMk-unsplash-m.jpg"
  title : "Build, Analyze, Improve, Maintain"
  content : "
  - We build fast, accessible, responsive, and affordable websites for small businesses, organizations, and clubs.


  - We analyze websites for performance, accessibility, security, and content issues that may negatively affect the site or limit access to content.


  - We improve existing small business websites with new features, fix bugs, and resolve issues we have found in our analysis.

  
  - We maintain existing small business websites to ensure all of the above, keeping your website secure, and keeping it online 24x7x365.
  "
  button:
    enable : true
    label : "View our Website Portfolio"
    link : "portfolio"


