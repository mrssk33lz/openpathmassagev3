################################## About #####################################
about:
  enable : true
  image : "images/arbor-logo-trans.png"
  title : "About Us"
  content : "<em>An arbor is a tree. We support Pennsylvania with our business and chose to include something about trees in the company name, as Pennsylvania is roughly translated to Penn's Woods. Pennsylvania has many trees!</em>
          
          
          Arbor Web Development is a Philadelphia website design company specializing in Drupal web development and DevOps that has been building and maintaining websites since 2007. Our small team allows us to rapidly develop affordable websites for small businesses to help grow and expand their brand presence online."

  button:
    enable : false
    label : "Download Company Profile"
    link : "#"

  funfacts:
    # funfacts loop
    - icon : "ion-ios-flask-outline" #ionicon pack v2 : https://ionicons.com/v2/
      name : "Years Building Websites"
      count : "14"
      
    # funfacts loop
    - icon : "ion-ios-flame-outline" #ionicon pack v2 : https://ionicons.com/v2/
      name : "Lines Of Code"
      count : "35000"
      
    # funfacts loop
    - icon : "ion-ios-pint-outline" #ionicon pack v2 : https://ionicons.com/v2/
      name : "Satisfied Customers"
      count : "31"
      
    # funfacts loop
    - icon : "ion-ios-wineglass-outline" #ionicon pack v2 : https://ionicons.com/v2/
      name : "Awards Winner"
      count : "10"
      
    # funfacts loop
    - icon : "ion-ios-chatboxes-outline" #ionicon pack v2 : https://ionicons.com/v2/
      name : "Satisfied Customer"
      count : "75"
      
    # funfacts loop
    - icon : "ion-ios-body-outline" #ionicon pack v2 : https://ionicons.com/v2/
      name : "Awards Winner"
      count : "20"
      
################################ feature #####################################
features:
  enable : true
  title : "We are a small web development agency specializing in Drupal web development, DevOps, website security, and website optimization. "
  feature_item:
    # feature item loop
    - icon : "ion-ios-color-filter-outline" #ionicon pack v2 : https://ionicons.com/v2/
      name : "Drupal Development"
      content : "We have over 16 years of Drupal development and training experience."
      
    # feature item loop
    - icon : "ion-ios-unlocked-outline" #ionicon pack v2 : https://ionicons.com/v2/
      name : "Website Security"
      content : "We ensure your website is secure and online 24x7x365."
    
    # feature item loop
    - icon : "ion-ios-mic-outline" #ionicon pack v2 : https://ionicons.com/v2/
      name : "DevOps"
      content : "We specialize in DevOps using automation, CI/CD, and Docker."
      
    # feature item loop
    - icon : "ion-ios-lightbulb-outline" #ionicon pack v2 : https://ionicons.com/v2/
      name : "Website Optmization"
      content : "We optimize websites for performance, usability, and accessibility"
      
    # feature item loop
    - icon : "ion-ios-star-outline" #ionicon pack v2 : https://ionicons.com/v2/
      name : "Hugo Development"
      content : "We also build low maintenance, no cost hosting websites using Hugo and Netlify."
    
    # feature item loop
    - icon : "ion-ios-game-controller-b-outline" #ionicon pack v2 : https://ionicons.com/v2/
      name : "Games Development"
      content : "We dabble in C# game and application development in Unity 3D."
    

