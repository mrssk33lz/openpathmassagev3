{{ define "main" }}
<div class="row justify-content-center">
  <div class="col-lg-15">
    <article>
      <div class="blog-header">
        <h1>{{ .Title }}</h1>
        {{ partial "main/blog-meta.html" . }}
      </div>
      {{ .Content }}
      {{ with .Params.tags }}
    
    <h3>Tags</h3>
    <ul id="tags">
      {{ range . }}
        <li> <a href="{{ "tags" | relURL }}/{{ . | urlize }}">{{ . }}</a> </li>
      {{ end }}
    </ul>
    {{ end }}
    </article>
  </div>
</div>
{{ end }}
